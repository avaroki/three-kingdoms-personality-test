name: Docker CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test-push:
    name: Build test and upload image
    runs-on: ubuntu-latest
    env:
      IMAGE: avaroki/three-kingdoms-personality-test
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Stamp version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump({'version': os.environ['GITHUB_SHA']}, f)
          PY
      - name: Build image
        run: docker build -t "$IMAGE:$GITHUB_SHA" .
      - name: Test website and assets
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hw3-ci-check -p 127.0.0.1:8080:80 "$IMAGE:$GITHUB_SHA"
          trap 'docker logs hw3-ci-check; docker rm -f hw3-ci-check' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health
          for path in / /script.js /style.css /version.json /images/liu-bei.png /images/cao-cao.png /images/zhuge-liang.png /images/guan-yu.png /images/zhang-fei.png /images/sun-quan.png /images/lu-bu.png /images/zhao-yun.png /images/zhou-yu.png /images/sima-yi.png; do
            curl --fail --silent --show-error "http://127.0.0.1:8080$path" -o /dev/null
          done
          curl --fail --silent http://127.0.0.1:8080/version.json | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["version"] == os.environ["GITHUB_SHA"]'
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Upload tested image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "## Docker CI succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP checks passed for the website, scripts, styles, version and all 10 character images." >> "$GITHUB_STEP_SUMMARY"
